plugins {
    id "com.android.application"
}

android {
    namespace "com.zyq.weatherink"
    compileSdk 34

    defaultConfig {
        applicationId "com.zyq.weatherink"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
